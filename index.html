<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>十个勤天手册 - 首页</title>
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 Google 字体以还原原图的优雅衬线字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

    <style>
        /* 针对首页的特殊样式定制 */
        body {
            background-color: #f7f5f0; /* 极浅的米色背景 */
            margin: 0;
        }

        /* 覆盖导航栏，还原原图通透感 */
        .navbar-custom {
            background-color: rgba(255, 255, 255, 0.4) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 12px 0;
        }

        /* 左侧文字区的排版 */
        .hero-section {
            position: relative;
            padding-top: 60px;
            min-height: calc(100vh - 80px); /* 撑满屏幕 */
        }

        /* 顶部的三个小标签 */
        .tag-badge {
            border: 1px solid #dcdcdc;
            background-color: rgba(255,255,255,0.5);
            color: #555;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 4px;
            margin-right: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* 英文字母 */
        .english-quote {
            font-family: 'Playfair Display', serif;
            letter-spacing: 6px;
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .english-quote::before, .english-quote::after {
            content: "";
            display: inline-block;
            width: 30px;
            height: 1px;
            background-color: #999;
            margin: 0 15px;
        }
        .english-quote::before { margin-left: 0; }

        /* 主标题 */
        .main-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 80px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        /* 副标题 */
        .sub-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            color: #333;
            line-height: 4;
            margin-bottom: 30px;
        }

        /* 底部深绿色色块 */
        .green-block {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            background-color: #2b4235; /* 深绿色 */
            z-index: 1;
            background-size: cover;
        }

        /* 浮在绿色色块上的文字卡片 */
        .hero-card {
            position: relative;
            z-index: 2;
            background-color: #f7f5f0;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 40px;
        }

        /* 按钮样式 */
        .btn-hero-primary {
            background-color: #2b4235;
            color: #fff;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
            border: none;
        }
        .btn-hero-primary:hover { background-color: #1e2f26; color: #fff; }

        .btn-hero-outline {
            background-color: transparent;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
        }
        .btn-hero-outline:hover { background-color: #fff; }

        /* 右侧轮播图卡片 */
        .carousel-container {
            position: relative;
            z-index: 2;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            margin-top: 40px;
            border: 4px solid rgba(255,255,255,0.2);
        }

        .carousel-item img {
            height: 65vh; /* 图片高度 */
            object-fit: cover;
            border-radius: 12px;
        }

        /* 轮播图底部文字 */
        .carousel-caption-custom {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: #fff;
            font-size: 12px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>

        <!-- 顶部导航栏 -->
    <div class="navbar-custom d-flex justify-content-between align-items-center px-5">
        <div class="fs-5 fw-bold d-flex align-items-center" style="color: #2b4235; font-family: 'Noto Serif SC', serif;">
            <span class="me-2">☀</span> 十个勤天手册
        </div>
        <div>
            <a href="index.html" class="nav-link-custom active" style="background-color: #e5e9e5; color: #2b4235; font-weight: bold; border-radius: 20px; padding: 6px 20px;">首页</a>
            <a href="members.html" class="nav-link-custom">成员</a>
            <a href="activities.html" class="nav-link-custom">活动</a>
            <a href="events.html" class="nav-link-custom">助农</a>
            <a href="checkin.html" class="nav-link-custom">签到</a>
            <a href="community.html" class="nav-link-custom">社区</a>
            <a href="gallery.html" class="nav-link-custom">名场面</a>
        </div>
        <a href="login.html" class="btn-login text-decoration-none" id="userStatus">登录</a>
    </div>

    <script>
        // 页面加载时检查有没有登录
        let currentUser = localStorage.getItem('loginUser');
        if(currentUser) {
            let statusBtn = document.getElementById('userStatus');
            if(statusBtn) {
                statusBtn.innerText = currentUser;

                statusBtn.href = "login.html"; 
                statusBtn.onclick = function() { localStorage.removeItem('loginUser'); location.reload(); }
            }
        }
    </script>

    <!-- 核心主视觉区 -->
    <div class="hero-section container-fluid px-5">
        <!-- 底部深绿色色块装饰 -->
        <div class="green-block"></div>

        <div class="row h-100 align-items-center position-relative" style="z-index: 2;">
            
            <!-- 左侧文字内容 -->
            <div class="col-lg-5 col-md-12">

                <!-- 英文描边字 -->
                <div class="english-quote">
                    BELIEVE IN THE LAND
                </div>

                <!-- 主标题 -->
                <h1 class="main-title">十个勤天</h1>
                
                <!-- 副标题 -->
                <div class="sub-title">
                    相信土地的力量<br>
                </div>

                <!-- 底部悬浮卡片 -->
                <div class="hero-card">
                    <p class="text-muted mb-4" style="font-size: 14px; line-height: 1.8;">
                        相信土地的力量，今日也在认真生长。这里像一本持续更新的田野纪实手册，整理成员动态、活动行程与陪伴记录。
                    </p>
                    
                    <div class="d-flex gap-3 mb-3">
                        <a href="members.html" class="btn btn-hero-primary">翻开十人田野档案 →</a>
                        <a href="activities.html" class="btn btn-hero-outline">查看田野日程</a>
                    </div>
                    
                </div>
            </div>

            <!-- 右侧轮播图  -->
            <div class="col-lg-7 col-md-12 ps-lg-5">
                                <div id="heroCarousel" class="carousel slide carousel-container" data-bs-ride="carousel" data-bs-interval="3000">
                    
                    <!-- 1. 轮播图指示器 -->
                    <div class="carousel-indicators" style="margin-bottom: 10px;">
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" style="width: 8px; height: 8px; border-radius: 50%;"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" style="width: 8px; height: 8px; border-radius: 50%;"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" style="width: 8px; height: 8px; border-radius: 50%;"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="3" style="width: 8px; height: 8px; border-radius: 50%;"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="4" style="width: 8px; height: 8px; border-radius: 50%;"></button>
                        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="5" style="width: 8px; height: 8px; border-radius: 50%;"></button>
                    </div>

                    <!-- 2. 轮播图片内容 -->
                    <div class="carousel-inner" style="border-radius: 12px;">
                        
                        <!-- 第 1 张图 -->
                        <div class="carousel-item active">
                            <img src="images/1.jpg" class="d-block w-100" alt="田野合照1">
                            <div class="carousel-caption-custom d-flex justify-content-between w-100 pe-4">
                            </div>
                        </div>
                        
                        <!-- 第 2 张图 -->
                        <div class="carousel-item">
                            <img src="images/2.jpg" class="d-block w-100" alt="田野合照2">
                            <div class="carousel-caption-custom d-flex justify-content-between w-100 pe-4">
                            </div>
                        </div>
                        
                        <!-- 第 3 张图 -->
                        <div class="carousel-item">
                            <img src="images/3.jpg" class="d-block w-100" alt="田野合照3">
                            <div class="carousel-caption-custom d-flex justify-content-between w-100 pe-4">
                            </div>
                        </div>
                        
                        <!-- 第 4 张图 -->
                        <div class="carousel-item">
                            <img src="images/4.jpg" class="d-block w-100" alt="田野合照4">
                            <div class="carousel-caption-custom d-flex justify-content-between w-100 pe-4">
                            </div>
                        </div>

                        <!-- 第 5 张图 -->
                        <div class="carousel-item">
                            <img src="images/5.jpg" class="d-block w-100" alt="田野合照5">
                            <div class="carousel-caption-custom d-flex justify-content-between w-100 pe-4">
                            </div>
                        </div>

                        <!-- 第 6 张图 -->
                        <div class="carousel-item">
                            <img src="images/6.jpg" class="d-block w-100" alt="田野合照6">
                            <div class="carousel-caption-custom d-flex justify-content-between w-100 pe-4">
                            </div>
                        </div>

                    </div>

                    <!-- 3. 左右切换箭头 -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev" style="width: 5%;">
                        <span class="carousel-control-prev-icon" aria-hidden="true" style="background-color: rgba(0,0,0,0.3); border-radius: 50%; padding: 15px;"></span>
                        <span class="visually-hidden">上一张</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next" style="width: 5%;">
                        <span class="carousel-control-next-icon" aria-hidden="true" style="background-color: rgba(0,0,0,0.3); border-radius: 50%; padding: 15px;"></span>
                        <span class="visually-hidden">下一张</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
