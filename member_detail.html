<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>成员详情 - 十个勤天</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-card {
            max-width: 1000px;
            margin: 40px auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .avatar-side {
            background: #e5e9e5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            flex-direction: column;
        }
        .avatar-side img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        /* 信息标签样式 */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;}
        .info-item { background: #f8f9fa; padding: 10px 15px; border-radius: 8px; font-size: 14px; }
        .info-item strong { color: #2b4235; }
        
        /* 时间轴样式 (核心) */
        .timeline {
            position: relative;
            padding-left: 20px;
            border-left: 2px solid #2b4235; /* 绿色竖线 */
            margin-top: 15px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 15px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -27px; /* 圆点定位 */
            top: 4px;
            width: 12px;
            height: 12px;
            background-color: #2b4235;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .timeline-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- 统一导航栏 -->
    <div class="navbar-custom text-center d-flex justify-content-between align-items-center px-5">
        <div class="fs-5 fw-bold" style="color: var(--primary-color);">☀ 十个勤天手册</div>
        <div>
            <a href="index.html" class="nav-link-custom">首页</a>
            <a href="members.html" class="nav-link-custom active">成员</a>
            <a href="activities.html" class="nav-link-custom">活动</a>
            <a href="events.html" class="nav-link-custom">助农</a>
            <a href="checkin.html" class="nav-link-custom">签到</a>
            <a href="community.html" class="nav-link-custom">社区</a>
            <a href="gallery.html" class="nav-link-custom">名场面</a>
        </div>
        <a href="login.html" class="btn-login text-decoration-none" id="userStatus">登录</a>
    </div>

    <div class="container">
        <div class="detail-card row" id="detailContainer">
            <div class="text-center p-5">数据加载中...</div>
        </div>
        
        <div class="text-center mt-3 mb-5">
            <a href="members.html" class="btn btn-outline-dark px-4" style="border-radius: 20px;">← 返回成员列表</a>
        </div>
    </div>

    <script>
        // 1. 获取URL上的 ID
        const urlParams = new URLSearchParams(window.location.search);
        const memberId = urlParams.get('id');

        if(memberId) {
            fetch('http://127.0.0.1:5000/api/member/' + memberId)
                .then(res => res.json())
                .then(data => {
                    if(data && data.name) {
                        let photoNum = parseInt(memberId) + 10; 
                        
                        // 2. 处理人生经历：把数据库带换行的字符串，切割成数组，然后生成时间轴HTML
                        let timelineHtml = '';
                        if(data.experience) {
                            // 按换行符切割 (\r\n 或 \n)
                            let expList = data.experience.split(/\r?\n/);
                            expList.forEach(exp => {
                                if(exp.trim() !== "") {
                                    timelineHtml += `<div class="timeline-item"><div class="timeline-text">${exp}</div></div>`;
                                }
                            });
                        } else {
                            timelineHtml = '<div class="text-muted small">这位少年还在努力生长中...</div>';
                        }

                        let html = `
                            <div class="col-md-4 avatar-side">
                                <img src="images/${photoNum}.jpg" onerror="this.src='https://picsum.photos/300/300?random=${memberId}'">
                                <h2 class="mb-1" style="font-family: 'Noto Serif SC', serif; color: #2b4235;">${data.name}</h2>
                                <span class="badge bg-success mb-2">${data.role}</span>
                                <p class="text-muted small text-center px-3">${data.intro}</p>
                            </div>
                            
                            <div class="col-md-8 p-4 p-md-5">
                                <h4 class="mb-4" style="border-left: 4px solid #2b4235; padding-left: 10px; color: #2b4235;">基础档案</h4>
                                
                                <!-- 基础信息 2x2 网格 -->
                                <div class="info-grid">
                                    <div class="info-item"><strong>生日：</strong> ${data.birthday || '未知'}</div>
                                    <div class="info-item"><strong>星座：</strong> ${data.constellation || '未知'}</div>
                                    <div class="info-item"><strong>生肖：</strong> ${data.zodiac || '未知'}</div>
                                    <div class="info-item"><strong>出生地：</strong> ${data.birth_place || '未知'}</div>
                                    <div class="info-item"><strong>应援色：</strong> ${data.fan_color || '未知'}</div>
                                    <div class="info-item"><strong>粉丝名：</strong> ${data.fan_name || '未知'}</div>
                                </div>
                                
                                <h4 class="mt-5 mb-3" style="border-left: 4px solid #2b4235; padding-left: 10px; color: #2b4235;">人生经历</h4>
                                <!-- 时间轴容器 -->
                                <div class="timeline">
                                    ${timelineHtml}
                                </div>
                            </div>
                        `;
                        document.getElementById('detailContainer').innerHTML = html;
                    } else {
                        document.getElementById('detailContainer').innerHTML = '<div class="text-center p-5 text-danger">未找到该成员信息</div>';
                    }
                })
                .catch(err => {
                    document.getElementById('detailContainer').innerHTML = '<div class="text-center p-5 text-danger">后端服务器未启动或数据异常</div>';
                });
        }
    </script>
</body>
</html>
