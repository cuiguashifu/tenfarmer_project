<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>相册与周边</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center text-success">📸 相册与公益周边</h2>
    <div class="text-center mb-4">
        <a href="index.html" class="btn btn-outline-success mx-1">首页</a>
        <a href="members.html" class="btn btn-outline-success mx-1">成员风采</a>
        <a href="events.html" class="btn btn-outline-success mx-1">助农事件</a>
        <a href="album.html" class="btn btn-success mx-1">相册周边</a>
    </div>

    <h4>现场实拍</h4>
    <div class="row mb-5" id="photoList"></div>

    <h4>公益周边</h4>
    <div class="row" id="merchList"></div>
</div>
<script>
    // 加载相册
    fetch('http://127.0.0.1:5000/api/photos').then(res=>res.json()).then(data=>{
        let html = '';
        data.forEach(p => {
            html += `<div class="col-md-4 mb-3">
                <div class="card shadow">
                    <img src="${p.image_path}" class="card-img-top" style="height:200px; object-fit:cover;">
                    <div class="card-body"><h6>${p.title}</h6><span class="badge bg-secondary">${p.category}</span></div>
                </div>
            </div>`;
        });
        document.getElementById('photoList').innerHTML = html;
    });

    // 加载周边
    fetch('http://127.0.0.1:5000/api/merch').then(res=>res.json()).then(data=>{
        let html = '';
        data.forEach(m => {
            html += `<div class="col-md-4 mb-3">
                <div class="card shadow">
                    <img src="${m.image_path}" class="card-img-top" style="height:200px; object-fit:cover;">
                    <div class="card-body">
                        <h5>${m.name}</h5>
                        <p class="text-muted small">${m.description}</p>
                        <a href="${m.official_link}" class="btn btn-outline-success btn-sm">前往官方渠道</a>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('merchList').innerHTML = html;
    });
</script>
</body>
</html>
