<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>成员风采</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center text-success">👨‍🌾 成员风采</h2>
    <div class="text-center mb-4">
        <a href="index.html" class="btn btn-outline-success mx-1">首页</a>
        <a href="members.html" class="btn btn-success mx-1">成员风采</a>
        <a href="events.html" class="btn btn-outline-success mx-1">助农事件</a>
        <a href="album.html" class="btn btn-outline-success mx-1">相册周边</a>
    </div>
    <div class="row" id="memberList"></div>
</div>
<script>
    fetch('http://127.0.0.1:5000/api/members').then(res=>res.json()).then(data=>{
        let html = '';
        data.forEach(m => {
            html += `<div class="col-md-3 mb-4">
                <div class="card shadow h-100">
                    <img src="https://picsum.photos/300/300?random=${m.member_id}" class="card-img-top" alt="avatar">
                    <div class="card-body text-center">
                        <h5 class="card-title">${m.name}</h5>
                        <p class="badge bg-success">${m.role}</p>
                        <p class="card-text text-muted">${m.intro}</p>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('memberList').innerHTML = html;
    });
</script>
</body>
</html>
