<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>助农事件</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center text-success">📅 助农事件时间轴</h2>
    <div class="text-center mb-4">
        <a href="index.html" class="btn btn-outline-success mx-1">首页</a>
        <a href="members.html" class="btn btn-outline-success mx-1">成员风采</a>
        <a href="events.html" class="btn btn-success mx-1">助农事件</a>
        <a href="album.html" class="btn btn-outline-success mx-1">相册周边</a>
    </div>
    <table class="table table-hover shadow bg-white">
        <thead class="table-success">
            <tr>
                <th>事件标题</th>
                <th>发生日期</th>
                <th>帮扶地</th>
                <th>详情</th>
            </tr>
        </thead>
        <tbody id="eventList"></tbody>
    </table>
</div>
<script>
    fetch('http://127.0.0.1:5000/api/events').then(res=>res.json()).then(data=>{
        let html = '';
        data.forEach(e => {
            html += `<tr>
                <td>${e.event_title}</td>
                <td>${e.event_date.split('T')[0]}</td>
                <td><span class="badge bg-info text-dark">${e.location_name}</span></td>
                <td>${e.content}</td>
            </tr>`;
        });
        document.getElementById('eventList').innerHTML = html;
    });
</script>
</body>
</html>
